services:
  - type: web
    name: ghost-grid
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
