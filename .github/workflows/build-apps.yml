name: Build EXE + APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix client install && npm --prefix client run build
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/index.html }
  windows-exe:
    needs: client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - run: |
          mkdir -p desktop/app
          cp web/index.html desktop/app/index.html
        shell: bash
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: GHOST-GRID-windows, path: desktop/release/*.exe }
  android-apk:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - run: |
          mkdir -p mobile/www && cp web/index.html mobile/www/index.html
          cd mobile && npm install && npx cap add android && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: GHOST-GRID-android, path: mobile/android/app/build/outputs/apk/debug/*.apk }
  release:
    needs: [windows-exe, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: GHOST-GRID-windows, path: out }
      - uses: actions/download-artifact@v4
        with: { name: GHOST-GRID-android, path: out }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out && ls -la
          mv *.apk GHOST-GRID.apk 2>/dev/null || true
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" --repo "${{ github.repository }}" --title "GHOST//GRID build ${{ github.run_number }}" --notes "EXE (Windows) and APK (Android) builds." *.exe GHOST-GRID.apk
